<style>/* Leaflet 1.9.4 (BSD-2) */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}

.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;

	}
.leaflet-tile-loaded {

	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {

	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {

.leaflet-interactive {

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {

	}

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;

	}
.leaflet-bar a,
.leaflet-control-layers-toggle {

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	background-color: #f4f4f4;

	}

.leaflet-touch .leaflet-bar a {
	width: 30px;

.leaflet-touch .leaflet-bar a:first-child {

/* zoom control */

.leaflet-control-zoom-in,

.leaflet-control-layers {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-popup {

	}
.leaflet-popup-tip {
	width: 17px;

	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;

	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}

}
.leaflet-tooltip-left:before,

.leaflet-tooltip-right:before {

<style>
:root{
  color-scheme: light;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F4F0E8; --ink:#14213D; --ink-2:#2B3A5C; --muted:#5B6478; --line:#E7E0D4; --line-2:#D9D0C1;
  --focus:#2D6CB5;
  --green:#21734F; --green-soft:#E4F1EA; --blue:#2559A0; --blue-soft:#E4EDF8; --purple:#5E3FA8; --purple-soft:#EEE8F8;
  --amber:#9A5B08; --amber-soft:#FBEFD9; --rose:#A3324F; --rose-soft:#F9E6EB;
  --orange:#B4540A; --orange-soft:#FCEBDA; --red:#B42318; --red-soft:#FDECEA; --gray:#5B6478; --gray-soft:#EEEDEA;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,33,61,.04),0 4px 14px -6px rgba(20,33,61,.08);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-head:Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:clamp(26px,4vw,36px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:100;text-decoration:none}
.skip:focus{top:12px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(250,247,242,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0;overflow:hidden}
.brand>span:last-child{min-width:0}
.brand b,.brand small{overflow:hidden;text-overflow:ellipsis}
@media (max-width:519px){.toddler-switch .long{display:none}}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 13px var(--font-head);flex:none}
.brand b{font:800 16px var(--font-head);display:block;white-space:nowrap}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap}
.spacer{flex:1}
.toddler-switch{white-space:nowrap;flex:none;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 12px;cursor:pointer;min-height:44px;font-weight:600;font-size:14px;user-select:none}
.toddler-switch .track{width:40px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s var(--ease-out)}
.toddler-switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease-out)}
.toddler-switch[aria-checked="true"]{border-color:var(--orange);background:var(--orange-soft)}
.toddler-switch[aria-checked="true"] .track{background:var(--orange)}
.toddler-switch[aria-checked="true"] .track::after{transform:translateX(16px)}
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}
.sidenav{display:none}
main{padding:20px 16px 110px;min-width:0}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.navlink{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap;border:0;background:none;cursor:pointer;font-family:inherit}
.navlink[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
@media (min-width:960px){
  .layout{grid-template-columns:232px 1fr;gap:28px;padding:0 16px}
  .sidenav{display:flex;flex-direction:column;gap:4px;position:sticky;top:72px;align-self:start;padding-top:22px}
  .sidenav .navlink{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:0 14px;min-height:44px}
  .sidenav .navlink:hover{background:var(--surface-2);color:var(--ink)}
  .sidenav .note{margin-top:14px;font-size:12px;color:var(--muted);padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px}
  main{padding:24px 0 64px}
  .bottomnav{display:none}
}
.view{animation:viewIn .22s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid3{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;margin-bottom:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s, border-color .15s, transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink-2)}
.btn.danger{color:var(--red);border-color:#F1C2BD}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
.btn.maps{background:var(--blue-soft);border-color:#C9DAF0;color:var(--blue)}
.btn.tt{background:#111;border-color:#111;color:#fff}
.btn.tt:hover{background:#2a2a2a}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.b-green{background:var(--green-soft);color:var(--green);border-color:#C6E2D3}
.b-blue{background:var(--blue-soft);color:var(--blue);border-color:#C9DAF0}
.b-orange{background:var(--orange-soft);color:var(--orange);border-color:#F3D3B3}
.b-red{background:var(--red-soft);color:var(--red);border-color:#F4C7C2}
.b-gray{background:var(--gray-soft);color:var(--gray);border-color:#DDDAD3}
.b-ink{background:var(--ink);color:#fff}
.b-walk{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;border:1px solid}
.callout svg{margin-top:2px}
.callout.red{background:var(--red-soft);border-color:#F4C7C2;color:#7A1A12}
.callout.gray{background:var(--gray-soft);border-color:#DDDAD3;color:#3F4656}
.callout.orange{background:var(--orange-soft);border-color:#F3D3B3;color:#6E3306}
.callout.blue{background:var(--blue-soft);border-color:#C9DAF0;color:#173B6E}
.callout.green{background:var(--green-soft);border-color:#C6E2D3;color:#124A31}
.callout b{font-weight:600}
.callout .grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:44px;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;transition:border-color .15s, box-shadow .15s}
.textarea{min-height:84px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(45,108,181,.15)}
.fields{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.fields.two{grid-template-columns:1fr 1fr}.fields.three{grid-template-columns:1fr 1fr 1fr}}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width .4s var(--ease-out)}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;margin:0;transition:background .15s,border-color .15s,transform .12s}
.check::after{content:"";width:10px;height:6px;border:2.4px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) scale(0);margin-top:-3px;transition:transform .18s var(--ease-out)}
.check:checked{background:var(--green);border-color:var(--green)}
.check:checked::after{transform:rotate(-45deg) scale(1)}
.check:active{transform:scale(.9)}
.check-hit{display:grid;place-items:center;width:44px;height:44px;margin:-10px;flex:none;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;padding:32px 16px;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--radius);background:var(--surface)}
.empty h3{margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:640px){.kv{grid-template-columns:repeat(3,1fr);gap:10px}}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kv dt{font-size:12px;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0;font-size:14px;font-weight:600}
dl{margin:0}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:700 12px/26px var(--font-head);text-align:center}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* destination colors */
.c-green{--a:var(--green);--a-soft:var(--green-soft)}
.c-blue{--a:var(--blue);--a-soft:var(--blue-soft)}
.c-purple{--a:var(--purple);--a-soft:var(--purple-soft)}
.c-amber{--a:var(--amber);--a-soft:var(--amber-soft)}
.c-rose{--a:var(--rose);--a-soft:var(--rose-soft)}
.dest-badge{background:var(--a-soft);color:var(--a);border-color:color-mix(in srgb,var(--a) 22%,transparent)}

/* ---------- home ---------- */
.hero{padding:22px;display:grid;gap:18px;overflow:hidden;position:relative}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.route-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.route-node{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--a-soft);color:var(--a);font-weight:700;font-size:14px}
.route-arrow{color:var(--line-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px;border-radius:12px;background:var(--surface-2)}
.stat b{font:800 22px var(--font-head);display:block}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.dest-card{overflow:hidden;display:flex;flex-direction:column}
.dest-art{height:132px;background:var(--a-soft);position:relative;overflow:hidden}
.dest-art img{width:100%;height:100%;object-fit:cover;display:block}
.dest-art svg{position:absolute;inset:0;width:100%;height:100%}
.dest-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.dest-body .row{margin-top:auto}
.up-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.up-item:first-child{border-top:0;padding-top:0}
.time-pill{font:700 13px var(--font-head);background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:58px;text-align:center}
.reminder{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.reminder:first-child{border-top:0;padding-top:0}
.links{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (min-width:720px){.links{grid-template-columns:repeat(3,1fr)}}
.qlink{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface);min-height:64px;transition:border-color .15s, background .15s}
.qlink:hover{border-color:var(--line-2);background:var(--surface-2)}
.qlink b{font-size:14px;display:flex;align-items:center;gap:6px}
.qlink span{font-size:12px;color:var(--muted)}
.today-card{border-left:4px solid var(--a)}

/* ---------- itinerary ---------- */
.toolbar{display:flex;flex-direction:column;gap:10px;background:var(--bg);padding:4px 0}
@media (min-width:960px){.toolbar{position:sticky;top:65px;z-index:10;padding:10px 0}}
.toolbar .row.end{justify-content:space-between}
.day{overflow:hidden}
.day-head{display:flex;gap:12px;align-items:flex-start;padding:16px;cursor:pointer;border-left:4px solid var(--a)}
.day-num{flex:none;width:52px;text-align:center;border-radius:12px;background:var(--a-soft);color:var(--a);padding:6px 0}
.day-num small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.day-num b{font:800 22px/1.1 var(--font-head)}
.day-title{flex:1;min-width:0}
.day-title h3{font-size:17px}
.day-title .row{gap:6px;margin-top:6px}
.chev{transition:transform .25s var(--ease-out)}
[aria-expanded="true"] > .chev, .day-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out)}
.collapse.open{grid-template-rows:1fr}
.collapse > .inner{overflow:hidden;min-height:0}
.day-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.day-meta{display:grid;gap:8px;grid-template-columns:1fr;font-size:14px}
@media (min-width:640px){.day-meta{grid-template-columns:repeat(3,1fr)}}
.day-meta div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.day-meta dt{font-size:12px;color:var(--muted);font-weight:600}
.day-meta dd{margin:2px 0 0}
.act{border:1px solid var(--line);border-radius:14px;background:#fff;transition:border-color .2s, box-shadow .2s}
.act.done{background:#FCFBF8}
.act.done .act-name{text-decoration:line-through;color:var(--muted)}
.act-row{display:flex;gap:12px;align-items:center;padding:12px 14px}
.act-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.act-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.act-time{font:700 13px var(--font-head);color:var(--a)}
.act-name{font-weight:600;font-size:15px}
.act-loc{font-size:13px;color:var(--muted)}
.act-chips{display:flex;gap:6px;flex-wrap:wrap}
.act-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.sub{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.fact .badge{margin-top:1px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toddler-only{display:none}
body.toddler .toddler-only{display:flex}
body.toddler .toddler-only.block{display:block}
body.toddler .act.has-toddler{border-color:#F3D3B3}
.tt-ref{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tt-ico{width:38px;height:38px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.tt-ref .grow{flex:1;min-width:0;flex-basis:160px}
@media (max-width:519px){.tt-ref .btn{width:100%}}
.tt-ref .url{font-size:12px;color:var(--muted);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tt-ref b{font-size:14px;display:block}
.tt-ref .ctx{font-size:13px;color:var(--ink-2)}
.inline-select{min-height:36px;padding:4px 10px;font-size:13px;border-radius:10px;border:1px solid var(--line-2);background:#fff;max-width:100%}

/* ---------- transport ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.status-list{display:grid;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.status-list div{display:flex;gap:10px;align-items:center}
.status-list .badge{min-width:118px;justify-content:center}
.opt{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#fff}
.opt.rec{border-color:#C6E2D3;box-shadow:inset 3px 0 0 var(--green)}
.opt-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.opt-head h4{font-size:15px;font-family:var(--font-head)}
.route-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:800 18px var(--font-head)}
details.gloss summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.gloss-list{display:grid;gap:8px;grid-template-columns:1fr;font-size:14px}
@media (min-width:640px){.gloss-list{grid-template-columns:1fr 1fr}}
.gloss-list div{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.toddler-score{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--orange-soft);color:#6E3306}

/* ---------- checklist ---------- */
.cl-item{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-height:52px}
.cl-item:first-of-type{border-top:0}
.cl-item label{flex:1;cursor:pointer;font-size:15px}
.cl-item.done label{color:var(--muted);text-decoration:line-through}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row .input{min-height:40px}

/* ---------- dialog & toast ---------- */
dialog{border:0;padding:0;border-radius:18px;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 24px 60px -12px rgba(20,33,61,.35)}
dialog::backdrop{background:rgba(20,33,61,.4)}
dialog[open]{animation:dlgIn .22s var(--ease-out)}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media (min-width:520px){.check-grid{grid-template-columns:repeat(3,1fr)}}
.check-grid label{display:flex;gap:8px;align-items:center;min-height:40px;font-size:14px;padding:0 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check-grid input{width:18px;height:18px;accent-color:var(--ink)}
.toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
@media (min-width:960px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -10px rgba(20,33,61,.5);animation:toastIn .25s var(--ease-out);pointer-events:auto;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}


/* ---------- peta & jalur ---------- */
.route-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.xp{display:flex;align-items:center;gap:10px;flex:1;min-width:180px;max-width:340px}
.xp .progress{flex:1;height:14px;background:#E6E1D7}
.xp .progress>span{background:#2F9E5B}
.xp b{font:800 16px var(--font-head)}
.route-wrap{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){
  .route-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
  .map-col{order:2;position:sticky;top:80px}
  .path-col{order:1}
}
.map-card{overflow:hidden}
.map-chips{padding:10px}
#map{height:340px;position:relative;z-index:0;background:#E9E5DD}
@media (min-width:1000px){#map{height:calc(100vh - 230px);min-height:420px}}
.map-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}
.map-note svg{margin-top:2px}
.leaflet-container{font-family:var(--font-ui)}
.leaflet-popup-content{margin:12px 14px}
.leaflet-popup-content-wrapper{border-radius:14px}
.pin{width:34px;height:34px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font:800 13px var(--font-head);border:3px solid #fff;box-shadow:0 2px 8px rgba(20,33,61,.35);cursor:pointer}
.pin.done{background:#fff;color:var(--a);border-color:var(--a)}
.pin.cur{animation:pinPulse 1.6s ease-out infinite}
@keyframes pinPulse{0%{box-shadow:0 0 0 0 rgba(20,33,61,.45),0 2px 8px rgba(20,33,61,.35)}100%{box-shadow:0 0 0 16px rgba(20,33,61,0),0 2px 8px rgba(20,33,61,.35)}}
.dest-pin{transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--a);color:#fff;padding:8px 12px;border-radius:999px;border:3px solid #fff;box-shadow:0 3px 10px rgba(20,33,61,.35);cursor:pointer;font:700 14px var(--font-head)}
.dest-pin span{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 8px;font-size:12px}
.pop small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.pop b{display:block;font:700 15px/1.3 var(--font-head);margin:2px 0 10px;color:var(--ink)}
.pop-btns{display:flex;gap:6px;flex-wrap:wrap}
.pop .btn.primary{color:#fff}

.path-col{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:24px;overflow:hidden}
.unit{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:10px}
.unit-band{width:100%;display:flex;gap:12px;align-items:center;background:var(--a);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 color-mix(in srgb,var(--a) 62%,#000)}
.unit-band small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.unit-band b{display:block;font:800 18px/1.25 var(--font-head);margin:2px 0}
.unit-band span{font-size:13px;opacity:.92}
.unit-band .grow{flex:1;min-width:0}
.unit-btn{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.unit-btn:hover{background:rgba(255,255,255,.22)}
.unit-note{font-size:13px;color:var(--muted);text-align:center;margin:14px 8px 0;max-width:440px}
.nodes{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.node-li{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(var(--x));position:relative}
.node-li.current{margin-top:36px}
.node{position:relative;width:72px;height:66px;border-radius:50%;border:0;background:var(--a);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 7px 0 color-mix(in srgb,var(--a) 62%,#000);transition:transform .1s ease,box-shadow .1s ease,filter .15s}
.node svg{width:30px;height:30px;stroke-width:2.4}
.node:hover{filter:brightness(1.06)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--a) 62%,#000)}
.node.todo{background:#E6E1D7;color:#8F8778;box-shadow:0 7px 0 #CBC3B3}
.node.todo:active{box-shadow:0 2px 0 #CBC3B3}
.node.current{outline:6px solid color-mix(in srgb,var(--a) 24%,transparent);outline-offset:6px}
.node.pop{animation:nodePop .5s var(--ease-out)}
@keyframes nodePop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.node-warn{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:800 13px/18px var(--font-head);border:2px solid #fff}
.node-label{text-align:center;max-width:200px;display:flex;flex-direction:column;gap:1px}
.node-label b{font-size:14px;font-weight:600;line-height:1.3;color:var(--ink)}
.node-label>span{font-size:12px;color:var(--muted)}
.node-li.done .node-label b{color:var(--muted)}
.node-label .seq{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font:800 11px var(--font-head);margin-right:6px;color:var(--ink-2);vertical-align:1px}
.start-bubble{position:absolute;top:-46px;background:#fff;border:2px solid var(--line-2);color:var(--a);font:800 13px var(--font-head);letter-spacing:.08em;padding:6px 12px;border-radius:12px;animation:bob 1.4s ease-in-out infinite;z-index:1;white-space:nowrap}
.start-bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;background:#fff;border-right:2px solid var(--line-2);border-bottom:2px solid var(--line-2);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.transfer-li{margin:26px 0 4px}
.node.transfer{border-radius:20px;background:#E8A23A;color:#fff;box-shadow:0 7px 0 #B57414}
.node.transfer:active{box-shadow:0 2px 0 #B57414}
.node.finish{background:#E6E1D7;color:#8F8778;box-shadow:0 7px 0 #CBC3B3;cursor:default;margin-top:18px}
.node.finish.done{background:#E8A23A;color:#fff;box-shadow:0 7px 0 #B57414}


.node.photo{width:92px;height:92px;padding:0;border:4px solid var(--a);background:var(--a-soft);color:var(--a)}
.node.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;transition:filter .2s}
.node.photo.todo{border-color:#D3CCBE;background:#EEE9E0;color:#8F8778}
.node.photo.todo img{filter:saturate(.35) brightness(1.04)}
.node.photo.current{outline-offset:5px}
.node-check{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#2F9E5B;color:#fff;display:grid;place-items:center;border:3px solid #fff;z-index:1}
.node-check svg{width:16px;height:16px;stroke-width:3}
.node .node-warn{z-index:1}
.node-li.current .start-bubble{top:-48px}
.pin-wrap{position:relative;width:34px;height:34px}
.pin-label{position:absolute;left:38px;top:50%;transform:translateY(-50%);background:#fff;color:var(--ink);font:600 12px/1.2 var(--font-ui);padding:4px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(20,33,61,.25);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--a);pointer-events:none}
.pop-img{display:block;width:220px;max-width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.sheet-band.has-photo{min-height:170px;align-items:flex-end;background-size:cover;background-position:center}
.sheet-band.has-photo .sheet-x{align-self:flex-start}


.pin.multi{width:max-content;min-width:34px;padding:0 6px;border-radius:17px;font-size:12px}
.pin-wrap .pin.multi{position:relative;left:50%;transform:translateX(-50%)}
.pin-label.multi{display:flex;flex-direction:column;gap:2px;white-space:nowrap;max-width:190px}
.pl-row{display:block;overflow:hidden;text-overflow:ellipsis}
.pl-row b{display:inline-block;min-width:16px;margin-right:4px;color:var(--a);font-weight:800}
.pl-row.done{color:var(--muted);text-decoration:line-through}
.pin-label .pl-row:only-child b{display:none}
.pop-item{display:flex;gap:10px;align-items:flex-start}
.pop-item+.pop-item{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pop-img.sm{width:64px;height:64px;flex:none;margin:0}
.pop-txt{min-width:0}
#map .pin-label.lhide{display:none}
#map .pin-label.left{left:auto;right:38px;border-left:0;border-right:3px solid var(--a)}
#map .pin-label.below{left:50%;top:40px;transform:translateX(-50%);border-left:0;border-top:3px solid var(--a)}
#map .pin-label.above{left:50%;top:auto;bottom:40px;transform:translateX(-50%);border-left:0;border-bottom:3px solid var(--a)}
.pin.multi{white-space:nowrap}
.gal{position:relative;background:#0c1222;flex:none}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/3;max-height:46dvh;width:100%;outline:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-slide{flex:0 0 100%;margin:0;scroll-snap-align:start;scroll-snap-stop:always}
.gal-slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;background:#1b2338}
.gal-nav{position:absolute;top:calc(50% - 34px);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:opacity .2s}
.gal-nav.prev{left:10px}.gal-nav.prev svg{transform:rotate(90deg)}
.gal-nav.next{right:10px}.gal-nav.next svg{transform:rotate(-90deg)}
.gal-nav:disabled{opacity:0;pointer-events:none}
.gal-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px}
.gal-dots{display:flex;gap:4px;flex:1}
.gal-dot{width:24px;height:24px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.gal-dot::after{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:width .2s,background .2s}
.gal-dot[aria-current]::after{width:18px;border-radius:4px;background:#fff}
.gal-count{font-weight:700}
.gal-credit{color:rgba(255,255,255,.85);text-decoration:underline;text-underline-offset:2px}
.gal-pages{display:none}
.gal.zoom{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center}
.gal.zoom .gal-track{aspect-ratio:auto;height:100dvh;max-height:none}
.gal.zoom .gal-slide img{object-fit:contain;background:#000;cursor:zoom-out}
.sheet-x.on-photo{position:absolute;top:12px;right:12px;background:rgba(12,18,34,.55);border-color:rgba(255,255,255,.35);z-index:3}
.sheet-band{position:static}
dialog.sheet{padding:0;width:min(560px,calc(100vw - 24px));max-height:min(88dvh,820px);flex-direction:column;overflow:hidden}
dialog.sheet[open]{display:flex}
@media (max-width:639px){
  dialog.sheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:90dvh}
  dialog.sheet[open]{animation:sheetUp .3s var(--ease-out)}
}
@keyframes sheetUp{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
.sheet .dlg-body{overflow:auto;flex:1}
.sheet-band{display:flex;gap:12px;align-items:flex-start;background:var(--a);color:#fff;padding:16px 18px}
.sheet.c-amber .sheet-band{background:#C9841F}
.sheet-band h2{color:#fff;font-size:19px;margin-top:2px}
.sheet-band small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.sheet-band .grow{flex:1;min-width:0}
.sheet-x{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff;flex:none}
.sheet-x:hover{background:rgba(255,255,255,.25)}
.sheet-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.big3d{width:100%;min-height:54px;border:0;border-radius:14px;background:#2F9E5B;color:#fff;font:800 16px var(--font-head);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 #1E6B3D}
.big3d:hover{background:#34AB63}
.big3d:active{transform:translateY(4px);box-shadow:0 1px 0 #1E6B3D}
.big3d.undo{background:#fff;color:var(--ink);border:2px solid var(--line-2);box-shadow:0 4px 0 var(--line-2)}
details.facts-d summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}


/* ===== Mobile adaptation ===== */
button,a,summary,.chip,.node{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.day-bar{position:sticky;top:var(--tb,64px);z-index:12;background:var(--bg);margin:0 -16px;padding:8px 16px;border-bottom:1px solid transparent}
.day-bar .chips{scroll-padding-inline:16px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.day-bar .chip svg{width:14px;height:14px}
@media (min-width:1000px){.day-bar{position:static;margin:0;padding:0}.day-bar .chips{-webkit-mask-image:none;mask-image:none;flex-wrap:wrap}}
.day-nav{display:flex;gap:10px;justify-content:space-between;width:100%;margin-top:28px}
.day-nav .btn{flex:1;min-height:52px;white-space:normal;text-align:left;justify-content:flex-start;line-height:1.25}
.day-nav .btn.primary{justify-content:center;text-align:center;flex:2}
.day-sub{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:baseline;gap:6px}
.day-sub .dest-dot{flex:none;transform:translateY(-1px)}
.dest-dot{width:8px;height:8px;border-radius:50%;background:var(--a);display:inline-block}
.menu-list{gap:4px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:14px;text-decoration:none;color:var(--ink);min-height:64px}
.menu-item:active,.menu-item:hover{background:var(--surface-2)}
.menu-item>svg:first-child{width:22px;height:22px}
.menu-item>svg:last-child{transform:rotate(-90deg);color:var(--muted);margin-left:auto}
.menu-item span{display:flex;flex-direction:column;gap:2px}
.menu-item b{font-size:16px;font-weight:600}
.menu-item small{font-size:13px;color:var(--muted)}
.dlg-extra{display:flex;gap:6px;margin-right:auto}
details.opt{padding:0;gap:0}
details.opt>summary{list-style:none;cursor:pointer;padding:14px;display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-start;justify-content:space-between;min-height:56px}
details.opt>summary .grow{flex:1;min-width:0;display:block}
details.opt>summary::-webkit-details-marker,.legend-card>summary::-webkit-details-marker{display:none}
details.opt>summary .chev,.legend-card>summary .chev{flex:none;margin-top:2px;color:var(--muted)}
details.opt[open]>summary .chev,.legend-card[open]>summary .chev{transform:rotate(180deg)}
details.opt>summary h4{font-size:15px}
.opt-peek{display:block;font-size:13px;color:var(--muted);margin-top:6px}
details.opt[open] .opt-peek{display:none}
.opt-body{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
.legend-card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;min-height:28px}
.leaflet-control-attribution{font-size:9px!important;line-height:1.3!important;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-touch .leaflet-bar a{width:36px;height:36px;line-height:36px}
@media (max-width:639px){
  body{font-size:15px}
  .input,.select,.textarea,.inline-select{font-size:16px}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand-mark{width:30px;height:30px;font-size:12px}
  .brand b{font-size:15px}
  .brand small{font-size:11.5px}
  .toddler-switch{padding:4px 6px 4px 10px;font-size:13px;gap:8px}
  main{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:26px}
  .route-head{gap:10px}
  .route-head .xp{max-width:none;flex-basis:100%}
  #map{height:clamp(240px,40vh,320px)}
  .map-note{font-size:11.5px;padding:8px 12px}
  .nodes{gap:20px}
  .node-label{max-width:230px}
  .toolbar .row.end{flex-wrap:nowrap;gap:8px}
  .toolbar .row.end>.row:first-child{flex:1;min-width:0}
  .toolbar .row.end>.row:first-child label{display:none}
  .toolbar .row.end>.row:first-child select{flex:1;min-width:0;width:100%}
  .tb-icon{width:40px;padding:0}
  .tb-icon .lbl{display:none}
  .toolbar .row.end>.row:last-child{flex-wrap:nowrap;gap:6px}
  .day-head{padding:14px}
  .day-num{width:46px}
  .day-num b{font-size:20px}
  .day-meta{gap:0;background:var(--surface-2);border-radius:12px;padding:4px 12px}
  .day-meta div{background:none;border-radius:0;padding:8px 0;display:grid;grid-template-columns:110px 1fr;gap:10px;border-top:1px solid var(--line)}
  .day-meta div:first-child{border-top:0}
  .day-meta dd{margin:0;font-size:14px}
  .kv{grid-template-columns:1fr;gap:0;background:var(--surface-2);border-radius:12px;padding:2px 12px}
  .kv div{background:none;border-radius:0;padding:9px 0;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:baseline;border-top:1px solid var(--line)}
  .kv div:first-child{border-top:0}
  .kv dd{margin:0}
  .tt-ref{flex-wrap:nowrap;padding:10px 12px;gap:10px}
  .tt-ref .tt-ico{width:34px;height:34px}
  .tt-ref .grow{flex-basis:auto}
  .tt-ref b{font-size:13px}
  .tt-ref .ctx{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-ref .url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
  .tt-ref .btn{width:auto!important;flex:none;padding:0 12px}
  dialog:not(.sheet){margin:auto 0 0;width:100vw;max-width:100vw;border-radius:22px 22px 0 0;max-height:92dvh}
  dialog:not(.sheet)[open]{animation:sheetUp .3s var(--ease-out)}
  .dlg-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .dlg-foot .btn{flex:1}
  .dlg-foot .dlg-extra{flex-basis:100%;margin:0 0 4px}
  .dlg-foot .dlg-extra .btn{flex:0 0 auto}
  .dlg-foot .dlg-extra .btn.danger{margin-left:auto}
  .gal-nav{display:none}
  .card-pad{padding:16px}
  .fields.three{grid-template-columns:1fr}
}
@media (max-width:639px) and (orientation:landscape){
  #map{height:62vh}
  .gal-track{max-height:58dvh}
}
@media (hover:hover){ .menu-item:hover{background:var(--surface-2)} }
@media (hover:none){ .node:hover{filter:none} }


/* ===== Apple-style polish ===== */
h1{letter-spacing:-0.022em;font-feature-settings:"ss01"}
h2,.unit-band b,.sheet-band h2{letter-spacing:-0.012em}
.eyebrow,.sub,.unit-band small,.sheet-band small{letter-spacing:.07em}
.xp b,.act-time,.time-pill,.gal-count,.node-label .seq,.pin span{font-variant-numeric:tabular-nums}
.topbar{background:rgba(250,247,242,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:rgba(20,33,61,.08)}
.bottomnav{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgba(255,255,255,.5);box-shadow:0 -1px 0 rgba(20,33,61,.08)}
.day-bar{background:rgba(250,247,242,.78);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px)}
.navlink{transition:transform .1s ease-out,background .15s,color .15s}
.navlink:active,.chip:active,.unit-btn:active,.menu-item:active{transform:scale(.95)}
.chip{transition:transform .1s ease-out,background .2s,color .2s,border-color .2s}
.navlink[aria-current="page"] svg{stroke-width:2.2}
.btn:active{transform:scale(.97);transition-duration:.08s}
/* sheets */
dialog::backdrop{background:rgba(20,33,61,calc(.42 * var(--dim,1)))}
.sheet-grab{display:none}
@media (max-width:639px){
  dialog{will-change:transform;box-shadow:0 -8px 40px -12px rgba(20,33,61,.35)}
  dialog .sheet-grab{display:block;position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(20,33,61,.22);z-index:6;pointer-events:none}
  dialog.sheet .sheet-grab{background:rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  dialog.menu-sheet .sheet-grab,dialog:not(.sheet) .sheet-grab{background:rgba(20,33,61,.22);box-shadow:none}
  .sheet-band,.dlg-head{touch-action:none}
  dialog:not(.sheet) .dlg-head{padding-top:22px}
  dialog.menu-sheet .dlg-head{padding-top:22px}
  .gal-track{touch-action:pan-x}
  dialog.dragging{transition:none!important}
  dialog.dragging *{pointer-events:none}
}
.gal-slide{background-size:cover;background-position:center;background-color:#1b2338}
.gal-slide img{opacity:0;transition:opacity .35s ease}
.gal-slide img.on{opacity:1}
.gal.zoom .gal-slide{background-image:none!important}
@media (prefers-reduced-transparency: reduce){
  .topbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
  .bottomnav{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
  .day-bar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (prefers-contrast: more){
  .topbar,.bottomnav,.day-bar{background:#fff;border-color:var(--ink)}
  .muted,.small.muted,.node-label>span{color:var(--ink-2)}
}
@media (prefers-reduced-motion: reduce){
  .gal-slide img{opacity:1}
  .navlink:active,.chip:active,.btn:active{transform:none}
}


/* ===== Sheet: one scroll area (photo + title + info), sticky title, pinned CTA ===== */
dialog.sheet{display:none}
dialog.sheet[open]{display:flex;flex-direction:column}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-scroll .sheet-band{padding-right:68px}
.sheet .sheet-scroll .dlg-body{overflow:visible;flex:none}
.sheet-scroll .sheet-band{position:sticky;top:0;z-index:3}
.sheet-x.on-photo{position:absolute;top:12px;right:12px;z-index:5}
.sheet-scroll .gal-track{aspect-ratio:3/2;max-height:44dvh}
@media (max-width:639px){ .sheet-scroll .gal-track{aspect-ratio:4/3;max-height:48dvh} .sheet-band,.dlg-head{touch-action:auto} .gal-track{touch-action:pan-x pan-y} }
.sheet-scroll::-webkit-scrollbar{width:0;height:0}


/* ===== Monochrome, low-distraction basemap ===== */
#map{background:#f1f1f0}
.tiles-mono{filter:grayscale(1)}
.tiles-osm{filter:grayscale(1) contrast(.85) brightness(1.08)}
.tiles-ref{filter:grayscale(1) contrast(.9);opacity:.85}

/* ---------- print ---------- */
.print-only{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:12px}
  .topbar,.sidenav,.bottomnav,.toolbar,.no-print,.toasts,dialog{display:none!important}
  .layout{display:block;padding:0}
  main{padding:0}
  .print-only{display:block}
  .card,.act{box-shadow:none;break-inside:avoid}
  .day{break-inside:auto}
  .collapse{grid-template-rows:1fr!important}
  .act-body{display:flex!important}
  .btn,.tt-ref .btn{display:none!important}
  a{color:var(--ink);text-decoration:none}

let state;
function normalize(s){
  const d = makeDefault();
  if(!s || typeof s!=="object") return d;
  const out = Object.assign({}, d, s);
  out.trip = Object.assign({}, d.trip, s.trip||{});
  out.trip.hotels = Object.assign({}, d.trip.hotels, (s.trip&&s.trip.hotels)||{});
  out.genting = Object.assign({}, d.genting, s.genting||{});
  out.notes = Object.assign({}, d.notes, s.notes||{});
  out.ui = Object.assign({}, d.ui, s.ui||{});
  if(!out.ui.open || typeof out.ui.open!=="object") out.ui.open = {};
  if(!out.ui.closedDays || typeof out.ui.closedDays!=="object") out.ui.closedDays = {};
  if(!Array.isArray(out.dests) || !out.dests.length) out.dests = d.dests;
  if(!Array.isArray(out.days)) out.days = d.days;
  out.days.forEach(day=>{
    day.id = day.id || uid("d"); day.activities = Array.isArray(day.activities)?day.activities:[]; day.tiktok = Array.isArray(day.tiktok)?day.tiktok:[];
    day.activities = day.activities.map(a=>A(Object.assign({}, a, {id:a.id||uid("a")})));
  });
  if(!Array.isArray(out.checklist)) out.checklist = d.checklist;
  if(!Array.isArray(out.toddlerList)) out.toddlerList = d.toddlerList;
  return out;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    state = raw ? normalize(JSON.parse(raw)) : makeDefault();
  }catch(e){ state = makeDefault(); setTimeout(()=>toast("Data tersimpan tidak bisa dibaca. Memakai template awal.",true),300); }
}
let saveTimer=null, storageOk=true;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk=true; }
    catch(e){ if(storageOk) toast("Gagal menyimpan di browser ini. Gunakan Ekspor JSON sebagai cadangan.",true); storageOk=false; }
  },150);
}

/* ---------- Sheet physics (Apple-style: 1:1 drag, velocity hand-off, momentum projection) ---------- */

    if((target>0 && x>=dlg.offsetHeight) || (Math.abs(x-target)<0.5 && Math.abs(v)<20)){ setSheetY(target); if(done) done(); return; }

  return true;
}

/* =========================================================
   TikTok
   ========================================================= */
function ttRef(url,ctx){
  const u=safeUrl(url); if(!u) return "";
  return `<div class="tt-ref"><span class="tt-ico">${icon("play")}</span>
    <div class="grow"><b>Lihat Referensi TikTok</b><span class="ctx">${esc(ctx||"")}</span><div class="url">${esc(u)}</div></div>
    <a class="btn sm tt" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Buka TikTok: ${esc(ctx||u)}">Buka TikTok ${icon("ext","sm")}</a></div>`;
}
function tiktokFor(destId){
  const map=new Map();
  TIKTOK_ORIGINAL.filter(t=>t.dest===destId).forEach(t=>map.set(t.url,t.ctx));
  state.days.filter(d=>d.dest===destId).forEach(d=>{
    d.tiktok.forEach(u=>{ if(!map.has(u)) map.set(u,d.title); });
    d.activities.forEach(a=>a.tiktok.forEach(u=>{ if(!map.has(u)) map.set(u,a.name); }));
  });
  return [...map.entries()].map(([url,ctx])=>({url,ctx}));
}
function viewTikTok(){
  const groups = state.dests.map(d=>({d,list:tiktokFor(d.id)}));
  const total = groups.reduce((s,g)=>s+g.list.length,0);
  return `<div class="section-title"><div><p class="eyebrow">${total} tautan</p><h1>Semua Referensi TikTok</h1></div></div>
  <p class="lead">Semua tautan asli kamu, dikelompokkan per destinasi. Dibuka di tab baru — video tidak di-embed agar selalu bisa diakses.</p>
  ${groups.map(({d,list})=>`<section class="card card-pad c-${d.color}" id="tt-${d.id}" aria-labelledby="tth-${d.id}">
    <div class="card-head"><h2 id="tth-${d.id}">${esc(d.name)}</h2><span class="badge dest-badge">${list.length} tautan</span></div>
    ${list.length?`<div class="stack" style="gap:8px">${list.map(t=>ttRef(t.url,t.ctx)).join("")}</div>`:`<div class="empty" style="padding:20px">Belum ada referensi. Tambahkan lewat Edit aktivitas.</div>`}
  </section>`).join("")}`;
}

function resolvePlace(p){ const m=/^\{hotel:(\w+)\}$/.exec(p); if(!m) return {q:p,ok:true}; const q=hotelQuery(m[1]); return {q,ok:!!q,dest:m[1]}; }

function clItems(list,scope){

}

function setBind(path,val){
  const p=path.split(".");
  if(p[0]==="trip"){ state.trip[p[1]] = (p[1]==="adults"||p[1]==="children") ? Math.max(0,parseInt(val,10)||0) : val; }
  else if(p[0]==="hotel"){ state.trip.hotels[p[1]] = state.trip.hotels[p[1]] || {name:"",address:"",link:""}; state.trip.hotels[p[1]][p[2]] = val; }
  else if(p[0]==="genting"){ state.genting[p[1]] = val; }
  else if(p[0]==="notes"){ state.notes[p[1]] = val; }
  else if(p[0]==="act"){ const f=findAct(p[1]); if(f) f.act[p[2]] = val; }
  save();
}
document.addEventListener("input",e=>{ const b=e.target.closest("[data-bind]"); if(b) setBind(b.dataset.bind,b.value); });
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.matches("[data-bind]")){
    setBind(t.dataset.bind,t.value);
    if(/^(trip\.departDate|trip\.returnDate|hotel\.)/.test(t.dataset.bind)){
      // Defer: a blur-triggered change can fire while #main is being replaced.
      setTimeout(()=>{ const f=document.activeElement && document.activeElement.id; render(true); if(f){ const el=document.getElementById(f); if(el) el.focus({preventScroll:true}); } },0);
    }
    return;
  }
  const act=t.dataset.action;
  if(act==="toggle-done"){ const f=findAct(t.dataset.id); f.act.done=t.checked; save();
    if(t.checked) toast(`"${f.act.name}" selesai.`); render(true); const cb=$(`#act-${f.act.id} .check`); if(cb) cb.focus({preventScroll:true}); }
  else if(act==="cl-toggle"){ const list=listFor(t.dataset.scope); const it=list.find(i=>i.id===t.dataset.id); it.done=t.checked; save(); render(true); const el=$("#cl-"+it.id); if(el) el.focus(); }
  else if(act==="set-filter-tr"){ state.ui.filterTr=t.value; save(); render(true); }
  else if(act==="move-act"){ if(!t.value) return; const f=findAct(t.dataset.id); const to=findDay(t.value); f.day.activities.splice(f.idx,1); to.activities.push(f.act); state.ui.closedDays[to.id]=false; save(); toast(`Dipindah ke "${to.title}".`); render(true); }
});
function listFor(scope){ if(scope==="toddler") return state.toddlerList; const g=state.checklist.find(x=>x.id===scope); return g?g.items:[]; }

document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]"); if(!f) return;

  if(f.dataset.form==="cl-add"){ const v=f.t.value.trim(); if(!v){ f.t.focus(); return; } listFor(f.dataset.scope).push({id:uid("c"),text:v,done:false,custom:true}); save(); render(true); const inp=$("#add-"+f.dataset.scope); if(inp) inp.focus(); toast("Item ditambahkan."); }

/* print / export / import */
let printRestore=null;
function doPrint(){
  const prevOpen=JSON.stringify(state.ui.open), prevClosed=JSON.stringify(state.ui.closedDays), prevHash=location.hash;
  state.days.forEach(d=>{ state.ui.closedDays[d.id]=false; d.activities.forEach(x=>state.ui.open[x.id]=true); });
  printRestore=()=>{ state.ui.open=JSON.parse(prevOpen); state.ui.closedDays=JSON.parse(prevClosed); printRestore=null; if(location.hash!==prevHash) location.hash=prevHash.slice(1)||"home"; else render(true); };
  if(location.hash!=="#itinerary"){ history.replaceState(null,"","#itinerary"); }
  render();
  setTimeout(()=>{ window.print(); },60);
}
window.addEventListener("afterprint",()=>{ if(printRestore) printRestore(); });
function doExport(){
  const data=JSON.stringify(Object.assign({app:"malaysia-trip-2026",exportedAt:new Date().toISOString()},state),null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`malaysia-trip-2026-backup-${todayStr()}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast("File JSON diunduh.");
}
function validImport(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return "Isi file bukan objek data.";
  if(!Array.isArray(o.days)) return "Data hari (days) tidak ditemukan.";
  for(const d of o.days){ if(!d || typeof d!=="object" || !Array.isArray(d.activities)) return "Format hari tidak valid."; for(const a of d.activities){ if(!a || typeof a.name!=="string") return "Format aktivitas tidak valid."; } }
  if(o.trip && typeof o.trip!=="object") return "Info perjalanan tidak valid.";
  return "";
}
$("#importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  if(file.size>5*1024*1024){ toast("File terlalu besar (maks 5 MB).",true); return; }
  const r=new FileReader();
  r.onerror=()=>toast("Gagal membaca file.",true);
  r.onload=async()=>{
    let o; try{ o=JSON.parse(r.result); }catch(err){ toast("File bukan JSON yang valid.",true); return; }
    const msg=validImport(o); if(msg){ toast("Impor gagal: "+msg,true); return; }
    if(!(await confirmBox("Ganti data dengan file ini?",`File berisi ${o.days.length} hari. Data di browser ini akan diganti.`,"Impor"))) return;
    delete o.app; delete o.exportedAt;
    state=normalize(o); save(); render(); toast("Data berhasil diimpor.");
  };
  r.readAsText(file);
});

function wmUrl(path,w){ return WM+path+"/"+w+"px-"+path.split("/").pop(); }
function wmPage(path){ return "https://commons.wikimedia.org/wiki/File:"+path.split("/").pop(); }
function galleryFor(a){
  const own=safeUrl(a.img);
  const n=String(a.name||"").toLowerCase(); const r=PHOTO_RULES.find(([k])=>n.includes(k));
  const list=(r?GAL[r[1]]:[]).map(p=>({src:wmUrl(p,1280),srcset:`${wmUrl(p,960)} 960w, ${wmUrl(p,1280)} 1280w, ${wmUrl(p,1920)} 1920w`,thumb:wmUrl(p,330),mid:wmUrl(p,500),page:wmPage(p)}));
  if(own) list.unshift({src:own,srcset:"",thumb:own,mid:own,page:""});
  return list;
}
function photoFor(a,size){ const g=galleryFor(a)[0]; return g?(size==="mid"?g.mid:g.thumb):""; }
const OFFS=[0,40,62,40,0,-40,-62,-40];

function seqMap(){ const m={}; let n=0; state.days.forEach(d=>d.activities.forEach(a=>{ n++; m[a.id]=n; })); return m; }
function currentActId(){ const x=allActs().find(x=>!x.a.done); return x?x.a.id:null; }
function nodeIcon(a){
  const t=a.transport||[];
  if(t.includes("gondola")) return "gondola"; if(t.includes("funikular")) return "train";
  if(/sunset|foto|konten/i.test(a.name)) return "star"; if(/makan|pasar|belanja|mal|pavilion|bintang|skyavenue/i.test(a.name)) return "bag";
  if(t[0]==="ktm"||t[0]==="lrt"||t[0]==="mrt"||t[0]==="ets") return "train"; if(t[0]==="bus") return "bus"; if(t[0]==="grab") return "car";
  return "pin";
}

function dayShown(d){ return routeDay==="all" || !routeDay || (routeDay.startsWith("dest:") ? d.dest===routeDay.slice(5) : routeDay===d.id); }
function pathHtml(){
  const cur=currentActId(), seq=seqMap(); let html="", n=0, prev=null;
  const shown=state.days.filter(dayShown);
  state.days.forEach((d,di)=>{
    if(!dayShown(d)) return;
    const ds=dest(d.dest);
    prev = di>0 ? state.days[di-1].dest : null;
    if(prev && prev!==d.dest){
      const key=PAIR[prev+">"+d.dest]; const a=dest(prev);
      html+=`<div class="node-li transfer-li" style="--x:0px"><button type="button" class="node transfer" data-action="transfer" data-from="${prev}" data-to="${d.dest}" ${key?"":"data-nokey"} aria-label="Perjalanan ${esc(a.name)} ke ${esc(ds.name)} — lihat pilihan transportasi">${icon("bus")}</button><span class="node-label"><b>${esc(a.short)} → ${esc(ds.short)}</b><span>Pindah kota · lihat transportasi</span></span></div>`;
    }
    prev=d.dest;
    const done=d.activities.filter(a=>a.done).length;
    html+=`<div class="unit c-${ds.color}" id="unit-${d.id}">
      <div class="unit-band"><div class="grow"><small>Hari ${di+1} · ${esc(ds.name)}</small><b>${esc(d.title)}</b><span>${d.date?esc(fmtDate(d.date,{weekday:"long",day:"numeric",month:"long"})):"Tanggal belum ditentukan"} · ${done}/${d.activities.length} selesai</span></div>
        <button type="button" class="unit-btn" data-action="show-map" data-id="${d.id}" aria-label="Lihat hari ${di+1} di peta">${icon("pin")}</button></div>
      ${d.notes?`<p class="unit-note">${esc(d.notes)}</p>`:""}
      <ol class="nodes">`;
    if(!d.activities.length) html+=`<li class="node-li" style="--x:0px"><span class="node-label"><span>Belum ada aktivitas.</span></span></li>`;
    d.activities.forEach(a=>{
      const off=OFFS[(seq[a.id]-1)%OFFS.length]; n++;
      const st=a.done?"done":(a.id===cur?"current":"todo");
      const warn=(a.warns||[]).some(w=>w.type==="red");
      html+=`<li class="node-li ${st}" style="--x:${off}px">
        ${st==="current"?`<span class="start-bubble" aria-hidden="true">MULAI</span>`:""}
        ${(()=>{const ph=photoFor(a); return `<button type="button" class="node ${ph?"photo":""} ${st} ${justDone===a.id?"pop":""}" data-action="node" data-id="${a.id}" aria-label="${seq[a.id]}. ${esc(a.name)}, ${esc(a.time||"jam fleksibel")}, ${st==="done"?"selesai":st==="current"?"berikutnya":"belum"}">${icon(nodeIcon(a))}${ph?`<img src="${esc(ph)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}${st==="done"?`<span class="node-check" aria-hidden="true">${icon("check")}</span>`:""}${warn?`<span class="node-warn" aria-hidden="true">!</span>`:""}</button>`;})()}
        <span class="node-label"><b><span class="seq">${seq[a.id]}</span>${esc(a.name)}</b><span>${esc(a.time||"Fleksibel")}${a.duration?` · ${esc(a.duration)}`:""}</span></span>
      </li>`;
    });
    html+=`</ol></div>`;
  });
  const s=stats();
  const last=shown[shown.length-1], first=shown[0];
  if(routeDay!=="all" && shown.length){
    const iF=state.days.indexOf(first), iL=state.days.indexOf(last);
    const pv=state.days[iF-1], nx=state.days[iL+1];
    if(nx || pv){
      html+=`<nav class="day-nav" aria-label="Pindah hari">${pv?`<button type="button" class="btn" data-action="map-day" data-id="${pv.id}" data-scroll="1">${icon("up","sm")}Hari ${iF}</button>`:"<span></span>"}${nx?`<button type="button" class="btn primary" data-action="map-day" data-id="${nx.id}" data-scroll="1">Lanjut Hari ${iL+2}: ${esc(nx.title)}</button>`:""}</nav>`;
      justDone=null; return html;
    }
  }
  html+=`<div class="node-li" style="--x:0px"><span class="node finish ${s.done===s.acts&&s.acts?"done":""}" aria-hidden="true">${icon("flag")}</span><span class="node-label"><b>${s.done===s.acts&&s.acts?"Trip selesai!":"Garis finish"}</b><span>${s.done}/${s.acts} aktivitas</span></span></div>`;
  justDone=null;

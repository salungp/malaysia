function initMap(){
  const el=$("#map"); if(!el) return;
  if(map){ try{ map.remove(); }catch(e){} map=null; }
  clusterLayer=null;
  if(typeof L==="undefined"){ el.innerHTML=`<div class="empty" style="margin:12px">Peta tidak bisa dimuat. Jalur di bawah tetap bisa dipakai.</div>`; return; }
  map=L.map(el,{maxZoom:19,minZoom:5,zoomControl:!matchMedia("(pointer:coarse)").matches,scrollWheelZoom:window.matchMedia("(pointer:fine)").matches,attributionControl:true});
  // Minimal monochrome basemap: Esri Light Gray Canvas (no API key).
  // Base has no labels; the reference layer (big place names only) shows only when zoomed out (≤12),
  // so street and small neighbourhood names never appear.
  let tileErr=0, usingOsm=false;
  const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  const attr='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>';
  const base=L.tileLayer(ESRI+"World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:19,attribution:attr,className:"tiles-mono"}).addTo(map);
  L.tileLayer(ESRI+"World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:12,className:"tiles-mono tiles-ref"}).addTo(map);
  base.on("tileerror",()=>{ if(usingOsm || ++tileErr<4) return; usingOsm=true; map.removeLayer(base);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"tiles-mono tiles-osm",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>'}).addTo(map); });
  mapLayer=L.layerGroup().addTo(map);
  map.on("moveend",()=>{ mapView={c:map.getCenter(),z:map.getZoom()}; });
  map.on("zoomend",renderClusters); map.on("moveend",()=>requestAnimationFrame(layoutLabels));
  const doFit=!mapView;
  if(mapView) map.setView(mapView.c,mapView.z,{animate:false}); else map.setView([3.6,101.5],7,{animate:false});
  drawMarkers(doFit);
  setTimeout(()=>map && map.invalidateSize(),50);
}
const HEX={green:"#21734F",blue:"#2559A0",purple:"#5E3FA8",amber:"#9A5B08",rose:"#A3324F"};
function layoutLabels(){
  const box=document.getElementById("map"); if(!box) return; const mb=box.getBoundingClientRect();
  const wraps=[...box.querySelectorAll(".pin-wrap")].sort((x,y)=>(+x.dataset.seq)-(+y.dataset.seq));
  const pins=wraps.map(w=>w.querySelector(".pin").getBoundingClientRect());
  const taken=[]; const hit=(r,o)=>!(r.right<=o.left||r.left>=o.right||r.bottom<=o.top||r.top>=o.bottom);
  wraps.forEach((w,idx)=>{ const l=w.querySelector(".pin-label"); if(!l) return;
    const area=(q)=>{ let a=0; const add=o=>{ const x=Math.min(q.right,o.right)-Math.max(q.left,o.left), y=Math.min(q.bottom,o.bottom)-Math.max(q.top,o.top); if(x>0&&y>0) a+=x*y; };
      taken.forEach(add); pins.forEach((p,k)=>{ if(k!==idx) add(p); }); return a; };
    let best=null;
    for(const pos of ["","left","below","above"]){
      l.classList.remove("lhide","left","below","above"); if(pos) l.classList.add(pos); l.style.marginLeft=""; l.style.marginTop="";
      let r=l.getBoundingClientRect();
      // keep the label inside the map by nudging it
      let dx=0, dy=0;
      if(r.right>mb.right-4) dx=(mb.right-4)-r.right; if(r.left+dx<mb.left+4) dx=(mb.left+4)-r.left;
      if(r.top<mb.top+4) dy=(mb.top+4)-r.top; if(r.bottom+dy>mb.bottom-20) dy=(mb.bottom-20)-r.bottom;
      if((pos===""||pos==="left") && dx){ continue; }   // side labels must not cover their own pin
      if(dx) l.style.marginLeft=dx+"px"; if(dy) l.style.marginTop=dy+"px";
      r=l.getBoundingClientRect(); const q={left:r.left-2,right:r.right+2,top:r.top-1,bottom:r.bottom+1};
      const ov=area(q); if(!best || ov<best.ov) best={pos,dx,dy,q,ov}; if(ov===0) break;
    }
    l.classList.remove("left","below","above"); l.style.marginLeft=""; l.style.marginTop="";
    if(!best){ l.classList.add("lhide"); return; }
    if(best.pos) l.classList.add(best.pos); if(best.dx) l.style.marginLeft=best.dx+"px"; if(best.dy) l.style.marginTop=best.dy+"px";
    l.style.zIndex=best.ov?"0":"1"; taken.push(best.q);
  });
}
function el_w(){ const m=document.getElementById("map"); return m?m.clientWidth:400; }
function drawMarkers(fit){
  if(!map) return;
  mapLayer.clearLayers(); markerById={}; if(clusterLayer) clusterLayer.clearLayers();
  const seq=seqMap(), cur=currentActId(), pts=[];
  if(routeDay==="all"){
    const order=[], groups={};
    state.days.forEach(d=>d.activities.forEach(a=>{ if(!validLL(a.ll)) return; if(!groups[d.dest]){ groups[d.dest]={pts:[],n:0,done:0}; order.push(d.dest);} groups[d.dest].pts.push(a.ll); groups[d.dest].n++; if(a.done) groups[d.dest].done++; }));
    const cs=order.map(id=>{ const g=groups[id]; const c=[g.pts.reduce((s,p)=>s+p[0],0)/g.pts.length, g.pts.reduce((s,p)=>s+p[1],0)/g.pts.length]; return {id,c,g}; });
    if(cs.length>1) L.polyline(cs.map(x=>x.c),{color:"#14213D",weight:3,opacity:.45,dashArray:"8 10"}).addTo(mapLayer);
    cs.forEach(({id,c,g})=>{ const ds=dest(id); pts.push(c);
      const m=L.marker(c,{title:ds.name,keyboard:true,icon:L.divIcon({className:"",html:`<div class="dest-pin c-${ds.color}"><b>${esc(ds.name)}</b><span>${g.done}/${g.n}</span></div>`,iconSize:null,iconAnchor:[0,0]})});
      m.on("click",()=>{ setRouteDay("dest:"+id); });
      m.addTo(mapLayer); });
    if(fit && pts.length){ map.fitBounds(L.latLngBounds(pts),{padding:[70,70],animate:false}); mapView={c:map.getCenter(),z:map.getZoom()}; }
    return;
  }
  dayItems=[];
  state.days.forEach(d=>{
    if(routeDay.startsWith("dest:") ? d.dest!==routeDay.slice(5) : routeDay!==d.id) return;
    const ds=dest(d.dest), line=[];
    d.activities.forEach(a=>{
      if(!validLL(a.ll)) return;
      line.push(a.ll); pts.push(a.ll);
      dayItems.push({a,d,ds,n:seq[a.id],st:a.done?"done":(a.id===cur?"cur":"")});
    });
    if(line.length>1) L.polyline(line,{color:HEX[ds.color]||"#14213D",weight:3,opacity:.75,dashArray:"6 8"}).addTo(mapLayer);
  });
  if(fit && pts.length){ map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[el_w()<600?44:36,el_w()<600?50:40],paddingBottomRight:[el_w()<600?44:Math.min(190,el_w()*0.45),el_w()<600?70:40],maxZoom:16,animate:false}); mapView={c:map.getCenter(),z:map.getZoom()}; }
  renderClusters();
}
let dayItems=[], clusterLayer=null;
function shortName(n){ return String(n).replace(/\s*\(.*?\)\s*/g," ").trim(); }
function renderClusters(){
  if(!map || !map._loaded) return;
  if(!clusterLayer) clusterLayer=L.layerGroup().addTo(map); else if(!map.hasLayer(clusterLayer)) clusterLayer.addTo(map);
  clusterLayer.clearLayers(); markerById={};
  if(routeDay==="all") return;
  // Group pins closer than ~46px at the current zoom so every name stays readable.
  const groups=[];
  dayItems.forEach(it=>{
    const pt=map.latLngToLayerPoint(it.a.ll);
    const g=groups.find(g=>g.pt.distanceTo(pt)<(el_w()<600?100:88));
    if(g) g.items.push(it); else groups.push({pt,items:[it]});
  });
  groups.forEach(g=>{
    const its=g.items, f=its[0], multi=its.length>1;
    const st=its.some(x=>x.st==="cur")?"cur":(its.every(x=>x.st==="done")?"done":"");
    const ns=its.map(x=>x.n), consec=ns.every((v,i)=>!i||v===ns[i-1]+1);
    const badge=multi?(its.every(x=>x.a.done)?"✓":(consec?`${ns[0]}–${ns[ns.length-1]}`:ns.length<=3?ns.join("·"):`${ns[0]}+${ns.length-1}`)):(f.a.done?"✓":f.n);
    const label=its.map(x=>`<span class="pl-row ${x.a.done?"done":""}"><b>${x.n}</b>${esc(shortName(x.a.name))}</span>`).join("");
    const m=L.marker(f.a.ll,{title:its.map(x=>x.a.name).join(", "),keyboard:true,riseOnHover:true,zIndexOffset:st==="cur"?1000:0,
      icon:L.divIcon({className:"",html:`<div class="pin-wrap c-${f.ds.color}" data-seq="${f.n}"><div class="pin ${st} ${multi?"multi":""}"><span>${badge}</span></div><span class="pin-label ${multi?"multi":""}">${label}</span></div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16]})});
    m.bindPopup(`<div class="pop c-${f.ds.color}">${its.map(x=>{const ph=photoFor(x.a,"mid");return `<div class="pop-item">${ph?`<img class="pop-img ${multi?"sm":""}" src="${esc(ph)}" alt="Foto ${esc(x.a.name)}" loading="lazy" onerror="this.remove()">`:""}<div class="pop-txt"><small>Hari ${state.days.indexOf(x.d)+1} · ${esc(x.ds.short)} · ${esc(x.a.time||"Fleksibel")}</small><b>${x.n}. ${esc(x.a.name)}</b>
      <div class="pop-btns"><button type="button" class="btn sm primary" data-pop-open="${x.a.id}">Lihat info</button>${multi?"":ext(mapsSearch(x.a.location||x.a.name),"Google Maps","sm maps")}</div></div></div>`;}).join("")}</div>`,{closeButton:true,autoPanPadding:[20,60],maxWidth:280});
    m.on("popupopen",e=>{ e.popup.getElement().querySelectorAll("[data-pop-open]").forEach(b=>b.onclick=()=>openSheet(b.dataset.popOpen)); });
    m.addTo(clusterLayer); its.forEach(x=>markerById[x.a.id]=m);
  });
  requestAnimationFrame(layoutLabels);
}
function flyTo(id){
  const f=findAct(id); if(!f || !validLL(f.act.ll)) { toast("Aktivitas ini belum punya titik di peta.",true); return; }
  if(!markerById[id]) setRouteDay(f.day.id,false);
  const mapEl=$("#map"); if(mapEl){ const r=mapEl.getBoundingClientRect(); if(r.top<60||r.bottom>innerHeight) mapEl.scrollIntoView({behavior:"smooth",block:"center"}); }
  map.flyTo(f.act.ll,16,{duration:.8});
  setTimeout(()=>{ const m=markerById[id]; if(m) m.openPopup(); },850);
}
function setRouteDay(id,fit,scrollTop){
  routeDay=id; $$(".map-chips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.id===id)));
  const chip=$(`.map-chips .chip[data-id="${id}"]`); if(chip) chip.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  const pc=$("#pathCol"); if(pc) pc.innerHTML=pathHtml();
  drawMarkers(fit!==false);
  if(scrollTop){ const top=($("#mapCol")||pc).getBoundingClientRect().top+scrollY-tbH()-56; if(scrollY>top) window.scrollTo({top,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
}
function tbH(){ const t=document.querySelector(".topbar"); return t?t.offsetHeight:64; }
function refreshRoute(){
  const pc=$("#pathCol"); if(pc) pc.innerHTML=pathHtml();
  const s=stats(); const xp=$(".xp"); if(xp){ xp.querySelector("span").style.width=(s.acts?Math.round(s.done/s.acts*100):0)+"%"; xp.querySelector("b").textContent=`${s.done}/${s.acts}`; }
  drawMarkers(false);
}

/* ---------- galeri foto ---------- */
function galleryHtml(g,name){
  return `<div class="gal" role="region" aria-roledescription="carousel" aria-label="Foto ${esc(name)}">
    <div class="gal-track" tabindex="0">${g.map((x,i)=>`<figure class="gal-slide" aria-label="Foto ${i+1} dari ${g.length}" style="background-image:url('${esc(x.thumb)}')"><img onload="this.classList.add('on')" src="${esc(x.src)}" ${x.srcset?`srcset="${esc(x.srcset)}" sizes="(max-width:640px) 100vw, 560px"`:""} alt="${esc(name)} — foto ${i+1}" ${i?'loading="lazy"':'fetchpriority="high"'} decoding="async" data-action="gal-zoom"></figure>`).join("")}</div>
    ${g.length>1?`<button type="button" class="gal-nav prev" data-action="gal-prev" aria-label="Foto sebelumnya">${icon("chev")}</button><button type="button" class="gal-nav next" data-action="gal-next" aria-label="Foto berikutnya">${icon("chev")}</button>`:""}
    <div class="gal-foot"><div class="gal-dots">${g.length>1?g.map((_,i)=>`<button type="button" class="gal-dot" data-action="gal-go" data-i="${i}" aria-label="Foto ${i+1}" ${i?"":'aria-current="true"'}></button>`).join(""):""}</div>
      <span class="gal-count">1/${g.length}</span>${g[0].page?`<a class="gal-credit" href="${esc(g[0].page)}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>`:""}</div>
    <script type="application/json" class="gal-pages">${JSON.stringify(g.map(x=>x.page)).replace(/</g,"\\u003c")}<\/script>
  </div>`;
}
function initGallery(el){
  if(!el) return; const tr=el.querySelector(".gal-track"); const n=tr.children.length;
  let pages=[]; try{ pages=JSON.parse(el.querySelector(".gal-pages").textContent); }catch(e){}
  const upd=()=>{ const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)); el.dataset.i=i;
    el.querySelectorAll(".gal-dot").forEach((d,k)=>d.toggleAttribute("aria-current",k===i));
    const c=el.querySelector(".gal-count"); if(c) c.textContent=`${i+1}/${n}`;
    const cr=el.querySelector(".gal-credit"); if(cr && pages[i]) cr.href=pages[i];
    const p=el.querySelector(".prev"), q=el.querySelector(".next"); if(p) p.disabled=i===0; if(q) q.disabled=i===n-1; };
  tr.addEventListener("scroll",()=>{ cancelAnimationFrame(tr._r); tr._r=requestAnimationFrame(upd); },{passive:true});
  tr.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){e.preventDefault();galGo(el,+el.dataset.i+1);} if(e.key==="ArrowLeft"){e.preventDefault();galGo(el,+el.dataset.i-1);} });
  window.addEventListener("resize",()=>galGo(el,+el.dataset.i||0,true),{passive:true});
  upd();
}
function galGo(el,i,instant){ const tr=el.querySelector(".gal-track"); const n=tr.children.length; i=Math.max(0,Math.min(n-1,i)); tr.scrollTo({left:i*tr.clientWidth,behavior:instant||matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }

/* ---------- sheet info aktivitas ---------- */
function openSheet(id){
  const f=findAct(id); if(!f) return; const a=f.act, d=f.day, ds=dest(d.dest), seq=seqMap();
  if(map) map.closePopup();
  const hq=hotelQuery(d.dest), place=a.location||a.name;
  lastFocus=document.activeElement;
  dlg.className="sheet c-"+ds.color;
  const gal=galleryFor(a), ph=gal.length;
  dlg.innerHTML=`<div class="sheet-scroll">${gal.length?galleryHtml(gal,a.name):""}<div class="sheet-band"><div class="grow"><small>Hari ${state.days.indexOf(d)+1} · ${esc(ds.name)}</small><h2 id="dlgTitle">${seq[a.id]}. ${esc(a.name)}</h2></div>
      <button type="button" class="btn icon sheet-x on-photo" data-action="dlg-close" aria-label="Tutup">${icon("x")}</button></div>
    <div class="dlg-body">
      <div class="row" style="gap:6px">
        <span class="badge b-walk">${icon("clock","sm")}${esc(a.time||"Fleksibel")}</span>${a.duration?`<span class="badge b-walk">${esc(a.duration)}</span>`:""}${trChips(a.transport)}
        ${a.done?`<span class="badge b-green">${icon("check","sm")}Selesai</span>`:""}
      </div>
      ${a.location?`<p class="muted small" style="display:flex;gap:6px;align-items:center">${icon("pin","sm")}${esc(a.location)}</p>`:""}
      ${(a.warns||[]).map(w=>`<div class="callout ${w.type}">${icon(w.type==="red"?"alert":"info")}<div class="grow">${esc(w.text)}</div></div>`).join("")}
      <div><p class="sub">Cara ke sana</p>
        ${a.fromHotel && !hq?`<div class="callout orange" style="margin-bottom:10px">${icon("hotel")}<div class="grow">Hotel belum ditentukan — rute dari hotel akan tersedia setelah alamat diisi.</div></div>`:""}
        ${a.route.length?`<ol class="steps">${a.route.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>`:`<p class="muted small">Belum ada langkah rute.</p>`}
        ${a.routeStatus!=="verified"?`<p class="src" style="margin-top:8px">Perlu verifikasi sebelum berangkat.</p>`:""}
      </div>
      ${a.toddler&&a.toddler.length?`<div class="toddler-score">${icon("baby")}<div><b>Tips toddler</b><ul style="margin:4px 0 0;padding-left:18px">${a.toddler.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div>`:""}
      ${a.facts&&a.facts.length?`<details class="facts-d"><summary>Info & sumber (${a.facts.length})</summary><div class="facts" style="margin-top:8px">${a.facts.map(fc=>`<div class="fact">${statusBadge(fc.status)}<span>${esc(fc.text)}${srcLinks(fc.src)}</span></div>`).join("")}</div></details>`:""}
      ${a.tiktok.length?`<div><p class="sub">Referensi TikTok</p><div class="stack" style="gap:8px">${a.tiktok.map(u=>ttRef(u,a.name)).join("")}</div></div>`:""}
      ${!a.tiktok.length && d.tiktok.length?`<div><p class="sub">Referensi TikTok hari ini</p><div class="stack" style="gap:8px">${d.tiktok.map(u=>ttRef(u,d.title)).join("")}</div></div>`:""}
      <div class="row">
        ${ext(mapsSearch(place),icon("pin","sm")+"Google Maps","sm maps")}
        ${a.fromHotel&&hq?ext(mapsDir(hq,place,"transit"),icon("route","sm")+"Rute dari hotel","sm maps"):""}
        ${validLL(a.ll)&&$("#map")?`<button type="button" class="btn sm" data-action="fly" data-id="${a.id}">${icon("pin","sm")}Lihat di peta</button>`:""}
        <a class="btn sm ghost" href="#itinerary" data-action="edit-from-sheet" data-id="${a.id}">${icon("edit","sm")}Edit</a>
      </div>
    </div>
    </div><div class="dlg-foot sheet-foot">
      <button type="button" class="btn big3d ${a.done?"undo":""}" data-action="sheet-done" data-id="${a.id}">${a.done?"Batalkan selesai":icon("check")+"Tandai selesai"}</button>
    </div>`;
  dlgSubmit=null;
  presentDialog();
  initGallery(dlg.querySelector(".gal"));
  const b=dlg.querySelector('[data-action="sheet-done"]'); if(b) b.focus();
}
function transferSheet(from,to){
  const key=PAIR[from+">"+to], r=ROUTES.find(x=>x.id===key), a=dest(from), b=dest(to);
  lastFocus=document.activeElement;
  dlg.className="sheet c-amber";
  dlg.innerHTML=`<div class="sheet-scroll"><div class="sheet-band"><div class="grow"><small>Pindah kota</small><h2 id="dlgTitle">${esc(a.name)} → ${esc(b.name)}</h2></div><button type="button" class="btn icon sheet-x on-photo" data-action="dlg-close" aria-label="Tutup">${icon("x")}</button></div>
    <div class="dlg-body">${r?`${r.warn?`<div class="callout red">${icon("alert")}<div class="grow">${esc(r.warn)}</div></div>`:""}${r.opts.map(routeOpt).join("")}`
      :`<div class="callout gray">${icon("info")}<div class="grow">Belum ada panduan untuk rute ini. Jadwal dan harga perlu dicek sebelum pemesanan.</div></div>`}</div>
    </div><div class="dlg-foot"><a class="btn" href="#transport" data-action="dlg-close-go">Semua transportasi</a><button type="button" class="btn primary" data-action="dlg-close">Tutup</button></div>`;
  dlgSubmit=null; presentDialog();
}

/* init */
load();
render();
</script>
